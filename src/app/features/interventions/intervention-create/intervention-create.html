<div class="cont">
  <form [formGroup]="interventionForm" (ngSubmit)="onSubmit()">
    <div>
      <h1>{{ interventionId ? 'Update' : 'Create' }} Intervention</h1>
    </div>

    <div>
      <label>Vehicle ID</label>
      <input type="number" formControlName="vehicule" placeholder="e.g., 12">
      <div class="text-red-500" *ngIf="interventionForm.get('vehicule')?.touched && interventionForm.get('vehicule')?.invalid">
        <small *ngIf="interventionForm.get('vehicule')?.errors?.['required']">Vehicle selection is required.</small>
      </div>
    </div>

    <div>
      <label>Type Intervention</label>
      <select formControlName="type">
        <option value="">-- Choisir un type --</option>
        <option value="REVISION">Révision (Entretien)</option> <!-- Changé ENTRETIEN en REVISION -->
        <option value="REPARATION">Réparation</option>
        <option value="DIAGNOSTIC">Diagnostic</option>
        <option value="CONTROLE">Contrôle</option>
        <option value="PNEUMATIQUES">Pneumatiques</option>
        <option value="AUTRE">Autre</option>
      </select>
      <div class="text-red-500" *ngIf="interventionForm.get('type')?.touched && interventionForm.get('type')?.invalid">
        <small *ngIf="interventionForm.get('type')?.errors?.['required']">Type is required.</small>
      </div>
    </div>

    <div>
      <label>Description</label>
      <input type="text" formControlName="description" placeholder="Describe the vehicle problem...">
      <div class="text-red-500" *ngIf="interventionForm.get('description')?.touched && interventionForm.get('description')?.invalid">
        <small *ngIf="interventionForm.get('description')?.errors?.['required']">Description is required.</small>
      </div>
    </div>

    <div>
      <label>Initial Diagnostic</label>
      <input type="text" formControlName="diagnostic" placeholder="e.g., Engine misfire detected...">
    </div>

    <div>
      <label>Status</label>
      <select formControlName="status">
        <option value="" disabled selected>Select status</option>
        <option value="RECUE">RECUE</option>
        <option value="DIAGNOSTIC_EN_COURS">DIAGNOSTIC EN COURS</option>
        <option value="DEVIS_A_VALIDER">DEVIS A VALIDER</option>
        <option value="EN_REPARATION">EN REPARATION</option>
        <option value="TERMINER">TERMINER</option>
        <option value="RESTITUEE">RESTITUEE</option>
        <option value="ANNULEE">ANNULEE</option>
      </select>
      <div class="text-red-500" *ngIf="interventionForm.get('status')?.touched && interventionForm.get('status')?.invalid">
        <small *ngIf="interventionForm.get('status')?.errors?.['required']">Status is required.</small>
      </div>
    </div>

    <div>
      <label>Priority</label>
      <select formControlName="priorite">
        <option value="" disabled selected>Select priority</option>
        <option value="BASSE">BASSE</option>
        <option value="MOYENNE">MOYENNE</option>
        <option value="HAUTE">HAUTE</option>
      </select>
      <div class="text-red-500" *ngIf="interventionForm.get('priorite')?.touched && interventionForm.get('priorite')?.invalid">
        <small *ngIf="interventionForm.get('priorite')?.errors?.['required']">Priority level is required.</small>
      </div>
    </div>

    <div>
      <label>Estimated Cost (DHs)</label>
      <input type="number" formControlName="coutEstime">
      <div class="text-red-500" *ngIf="interventionForm.get('coutEstime')?.touched && interventionForm.get('coutEstime')?.invalid">
        <small *ngIf="interventionForm.get('coutEstime')?.errors?.['required']">Estimated cost is required.</small>
        <small *ngIf="interventionForm.get('coutEstime')?.errors?.['min']">Cost cannot be negative.</small>
      </div>
    </div>

    <div>
      <label>Deposit Date</label>
      <input type="date" formControlName="dateDepot">
      <div class="text-red-500" *ngIf="interventionForm.get('dateDepot')?.touched && interventionForm.get('dateDepot')?.invalid">
        <small *ngIf="interventionForm.get('dateDepot')?.errors?.['required']">Deposit date is required.</small>
      </div>
    </div>

    <div>
      <label>Expected Return Date</label>
      <input type="date" formControlName="dateRestitutionPrevue">
      <div class="text-red-500" *ngIf="interventionForm.get('dateRestitutionPrevue')?.touched && interventionForm.get('dateRestitutionPrevue')?.invalid">
        <small *ngIf="interventionForm.get('dateRestitutionPrevue')?.errors?.['required']">Expected return date is required.</small>
      </div>
    </div>

    <div>
      <button type="submit" [disabled]="interventionForm.invalid">
        {{ interventionId ? 'Update' : 'Create' }} Intervention
      </button>
    </div>
  </form>
</div>
