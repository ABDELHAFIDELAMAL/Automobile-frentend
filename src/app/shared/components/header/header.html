<header class="h-16 w-full bg-white border-b border-slate-100 flex items-center justify-between px-6 flex-shrink-0">

  <div class="flex items-center gap-4">
    <!-- BTON TOGGLE : Visible sur mobile/ipad (block), Caché sur PC (md:hidden) -->
    <button
      (click)="toggleMenu.emit()"
      class="block md:hidden p-2 rounded-lg text-slate-500 hover:bg-slate-100 active:bg-slate-200 transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>

    <h2 class="text-lg font-semibold text-slate-700 hidden sm:block">Gestion Atelier</h2>
  </div>

  <div class="flex items-center gap-4">
    <span class="text-sm font-medium text-slate-500">Garage Centre</span>
  </div>
</header>
