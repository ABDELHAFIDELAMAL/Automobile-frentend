<section class="max-w-md mx-auto mt-10 p-6 bg-white border border-slate-100 rounded-2xl shadow-xl">
  <div class="border-b border-slate-100 pb-4 mb-6 flex justify-center items-center">
    <h1 class="text-xl font-bold text-slate-800 tracking-tight ">Mon Profile</h1>
  </div>

  <div class="flex flex-col items-center text-center">
    <div class="w-16 h-16 bg-indigo-600 text-white rounded-full flex items-center justify-center text-xl font-extrabold shadow-md mb-4 uppercase">
      {{ prenom.slice(0, 1) }}{{ nom.slice(0, 1) }}
    </div>

    <h2 class="text-lg font-bold text-slate-800 capitalize">{{ prenom }} {{ nom }}</h2>
    <p class="text-sm text-slate-500 mb-6">{{ email }}</p>

    <div class="w-full text-left">
      <label class="block text-sm font-semibold text-slate-700 mb-2">Rôles assignés</label>
      <label>
        <select class="w-full px-4 py-2.5 border border-slate-200 rounded-xl bg-slate-50 outline-none text-sm text-slate-700 cursor-default shadow-sm" disabled>
          @for (role of roles; track role) {
          <option [value]="role" selected>{{ role }}</option>
          }
        </select>
      </label>
    </div>
  </div>
</section>
