<aside class="sidebar-container">
  <div class="sidebar-top">
    <div class="sidebar-brand">
      <h2>Gestion Atelier</h2>
      <p>MANAGEMENT SYSTEM</p>
    </div>

    <nav>
      <p class="menu-title">Main menu</p>

      <ul class="menu-list">
        <li
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }"
          routerLink="/dashboard"
          class="menu-item"
        >
          <a routerLink="/dashboard" class="menu-link">
            <span class="material-symbols-outlined menu-icon">dashboard</span>
            <span class="menu-text">Dashboard</span>
          </a>
        </li>

        <li
          routerLinkActive="active-link"
          routerLink="/vehicules"
          class="menu-item"
        >
          <a routerLink="/vehicules" class="menu-link">
            <span class="material-symbols-outlined menu-icon">directions_car</span>
            <span class="menu-text">Véhicules</span>
          </a>
        </li>
        <li
          routerLinkActive="active-link"
          routerLink="/inteventions"
          class="menu-item"
        >
          <a routerLink="/inteventions" class="menu-link">
            <span class="material-symbols-outlined menu-icon">build</span>
            <span class="menu-text">Interventions</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>

  <div class="sidebar-bottom">
    <div class="user-profile">
      <div class="user-avatar-container">
        <span class="material-symbols-outlined">person</span>
      </div>
      <div class="user-info">
        <p class="user-name">Abdelhafid</p>
        <p class="user-role">Administrator</p>
      </div>
    </div>

    <button type="button" class="logout-button">
      <span class="material-symbols-outlined logout-icon">logout</span>
      <span>Log out</span>
    </button>
  </div>
</aside>
