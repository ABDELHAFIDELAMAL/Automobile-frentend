<!-- Mobile top bar -->
<div class="mobile-topbar">
  <button class="menu-btn" (click)="toggle()" aria-label="Ouvrir le menu">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <span class="mobile-logo">GleetOps</span>
  <div class="w-8"></div>
</div>


<div class="overlay" [class.overlay-visible]="isOpen" (click)="close()"></div>

<aside class="sidebar" [class.sidebar-open]="isOpen">
  <div class="sidebar-header">
    <div class="logo-mark">FO</div>
    <div>
      <p class="logo-title">FleetOps</p>
      <p class="logo-sub">Gestion de parc</p>
    </div>
  </div>

  <nav class="nav-group">
    <p class="nav-label">Général</p>

    <a routerLink="/dashboard" routerLinkActive="nav-item-active" class="nav-item" (click)="close()">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/>
        <rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>
      </svg>
      <span>Dashboard</span>
    </a>

    <a routerLink="/vehicules" routerLinkActive="nav-item-active" class="nav-item" (click)="close()">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M5 17h1a2 2 0 0 0 4 0h4a2 2 0 0 0 4 0h1a1 1 0 0 0 1-1v-4l-3-4h-4l-2-3H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1Z"/>
        <circle cx="7.5" cy="17.5" r="1.6"/><circle cx="16.5" cy="17.5" r="1.6"/>
      </svg>
      <span>Véhicules</span>
      <span class="nav-badge">24</span>
    </a>

    <a routerLink="/interventions" routerLinkActive="nav-item-active" class="nav-item" (click)="close()">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.1-3.1a4 4 0 0 1-5.34 5.34L7.7 19.4a2 2 0 0 1-2.8-2.8l7.8-7.8A4 4 0 0 1 18 4.4l-3.3 1.9Z"/>
      </svg>
      <span>Interventions</span>
      <span class="nav-badge nav-badge-alert">5</span>
    </a>
  </nav>

  <nav class="nav-group">
    <p class="nav-label">Compte</p>

    <a routerLink="/profil" routerLinkActive="nav-item-active" class="nav-item" (click)="close()">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
      </svg>
      <span>Profil</span>
    </a>

    <a routerLink="/parametres" routerLinkActive="nav-item-active" class="nav-item" (click)="close()">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 2v20M2 12h20"/>
      </svg>
      <span>Paramètres</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button type="button" class="nav-item nav-item-danger w-full text-left" (click)="logout()">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Déconnexion</span>
    </button>

    <div class="user-card">
      <div class="user-avatar">SB</div>
      <div class="user-meta">
        <p class="user-name">Sara Bennani</p>
        <p class="user-role">Responsable parc</p>
      </div>
    </div>
  </div>
</aside>
