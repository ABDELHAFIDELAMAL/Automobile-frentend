<aside [class.collapsed]="isCollapsed()">
  <div class="sidebar-header">
    <div class="logo-box">
      <span class="material-symbols-outlined">car_gear</span>
    </div>
    <div class="brand-info">
      <p class="brand-name">Automobile</p>
      <p class="brand-sub">Gestion Atelier</p>
    </div>
    <div class="toggle-btn" (click)="toggleSidebar()">
      <span class="material-symbols-outlined">chevron_right</span>
    </div>
  </div>

  <nav class="nav-menu">
    <div class="nav-item" routerLink='/home' routerLinkActive="active">
      <span class="material-symbols-outlined">home</span>
      <p>Home</p>
    </div>

    <div class="nav-item" routerLink="/dashboard" routerLinkActive="active">
      <span class="material-symbols-outlined">dashboard</span>
      <p>Dashboard</p>
    </div>

    <div class="nav-item" routerLink="/vehicules" routerLinkActive="active">
      <span class="material-symbols-outlined">directions_car</span>
      <p>Vehicules</p>
    </div>

    <div class="nav-item" routerLink="/interventions" routerLinkActive="active">
      <span class="material-symbols-outlined">build</span>
      <p>Interventions</p>
    </div>

    <div class="nav-item" routerLink="/historiques" routerLinkActive="active">
      <span class="material-symbols-outlined">history</span>
      <p>Historique</p>
    </div>

    <div class="nav-item" routerLink="/mecaniciens" routerLinkActive="active">
      <span class="material-symbols-outlined">engineering</span>
      <p>Mecaniciens</p>
    </div>

    <div class="nav-item" routerLink="/utilisateurs" routerLinkActive="active">
      <span class="material-symbols-outlined">frame_person</span>
      <p>Utilisateurs</p>
    </div>
  </nav>

  <div class="sidebar-footer">
    <div class="nav-item logout-item">
      <span class="material-symbols-outlined">logout</span>
      <p>Logout</p>
    </div>
  </div>
</aside>
